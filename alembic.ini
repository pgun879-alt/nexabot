[alembic]
script_location = migrations
; `src` keeps `import nexabot` working even without an editable install.
prepend_sys_path = . src
path_separator = os

; Deliberately empty. migrations/env.py resolves the URL from DATABASE_URL via
; the normal settings path (or from config.attributes["database_url"] when
; tooling points the chain somewhere else), so a value here would be dead.
; Checking a credential-shaped default into the repository teaches people to
; edit it and makes a real credential easy to commit by accident.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
